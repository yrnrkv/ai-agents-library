services:
  - type: web
    name: ai-library-agent
    env: python
    # Free tier: $0, no persistent disk. First visit after idle has a ~50s
    # cold start. To keep it always-on (no cold start), change `free` to
    # `starter` and re-add a disk (see the commented block at the bottom).
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # No DATA_DIR set → the app uses the repo-bundled data/ (39-book catalog).
      - key: SKIP_OLLAMA_PROBE
        value: "1"
      - key: ALLOW_SAMPLE_SEED
        value: "0"
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-lite
      - key: CLOUD_LLM_PER_CALL_TIMEOUT
        value: "40"
      - key: GEMINI_TOTAL_BUDGET_SEC
        value: "55"
      - key: GEMINI_MIN_CALL_TIMEOUT
        value: "20"
      # Set this secret in the Render dashboard (Environment tab).
      - key: GEMINI_API_KEY
        sync: false

# --- Always-on option (paid) -------------------------------------------------
# To avoid cold starts, set `plan: starter` above, add `DATA_DIR=/var/data` to
# envVars, and uncomment this disk:
# disks:
#   - name: ai-library-data
#     mountPath: /var/data
#     sizeGB: 2
